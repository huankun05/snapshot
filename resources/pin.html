<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>eIsland Pin</title>
<link rel="stylesheet" href="./pin.css">
</head>
<body>
<img id="pinImage" draggable="false" alt="">

<!-- 左上角尺寸标签：仅悬停时显示 -->
<div class="pin-size" id="pinSize">0 × 0</div>

<!-- 悬停工具条：复制 / 保存 / 销毁 -->
<div class="pin-bar" id="pinBar">
  <button id="btnPinCopy" title="复制到剪贴板" aria-label="复制到剪贴板">
    <img class="pin-bar-icon" src="./svg/COPY.svg" alt="" aria-hidden="true">
  </button>
  <button id="btnPinSave" title="另存为" aria-label="另存为">
    <img class="pin-bar-icon" src="./svg/SAVE.svg" alt="" aria-hidden="true">
  </button>
  <button class="danger" id="btnPinClose" title="销毁贴图" aria-label="销毁贴图">
    <img class="pin-bar-icon" src="./svg/CANCEL.svg" alt="" aria-hidden="true">
  </button>
</div>

<!-- 首次出现的操作引导，几秒后淡出 -->
<div class="pin-hint" id="pinHint">拖动移动 · 滚轮缩放 · 点 × 销毁</div>

<script src="./pin.js"></script>
</body>
</html>
